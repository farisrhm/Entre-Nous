workflows:
  ios-testflight:
    name: iOS • TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Entre Nous

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - supabase-prod
      vars:
        BUNDLE_ID: "fr.jusquanous.jusquaNous"
        WEDDING_CLOUD_MODE: "auto"
        # À définir dans Codemagic (Environment variables) en mode Secret:
        # SUPABASE_URL
        # SUPABASE_PUBLISHABLE_KEY

    scripts:
      - name: Validate required variables
        script: |
          set -e
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: CocoaPods install
        script: |
          cd ios
          pod install
          cd ..

      - name: Configure iOS signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build Flutter iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY \
            --dart-define=WEDDING_CLOUD_MODE=$WEDDING_CLOUD_MODE

      - name: Archive and export signed IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - gaming.by.alkatraz@gmail.com

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  android-release:
    name: Android • Release AAB
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable
      groups:
        - supabase-prod
      vars:
        WEDDING_CLOUD_MODE: "auto"
        # À définir dans Codemagic (Environment variables) en mode Secret:
        # SUPABASE_URL
        # SUPABASE_PUBLISHABLE_KEY

    scripts:
      - name: Validate required variables
        script: |
          set -e
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing SUPABASE_URL"
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Build appbundle
        script: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY \
            --dart-define=WEDDING_CLOUD_MODE=$WEDDING_CLOUD_MODE

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      email:
        recipients:
          - gaming.by.alkatraz@gmail.com

      # Optionnel : activer après configuration de Google Play service account dans Codemagic
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
