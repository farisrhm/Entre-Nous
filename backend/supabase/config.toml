project_id = "jusqua-nous"

# Every handler verifies the user JWT with auth.getUser before any service-role call.
# This supports projects using asymmetric JWT signing keys.
[functions.wedding-list]
verify_jwt = false
[functions.wedding-save]
verify_jwt = false
[functions.wedding-delete]
verify_jwt = false

# User JWT checked explicitly, matching the existing wedding functions.
[functions.wedding-push-device]
verify_jwt = false
# Cron-only: separate server secret, never accepted from a mobile client.
[functions.wedding-push-dispatch]
verify_jwt = false
